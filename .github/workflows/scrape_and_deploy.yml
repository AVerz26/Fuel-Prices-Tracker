name: Coleta Menor Preço SEFAZ-MT e Deploy Pages

on:
  schedule:
    # Executa a cada 6 horas todos os dias (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite disparo manual a qualquer momento no GitHub
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'menor_preco_playwright.py'
      - '.github/workflows/scrape_and_deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape-to-database:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Navegador Playwright (Chromium)
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Executar Scraper e Salvar no Firebase Firestore
        env:
          SEFAZ_USERNAME: ${{ secrets.SEFAZ_USERNAME }}
          SEFAZ_PASSWORD: ${{ secrets.SEFAZ_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python menor_preco_playwright.py

  deploy-github-pages:
    runs-on: ubuntu-latest
    needs: scrape-to-database
    if: always()

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Empacotar Artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: 🚀 Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
